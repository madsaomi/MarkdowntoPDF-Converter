name: E2E Export

# Сквозная проверка экспорта с НАСТОЯЩИМ движком WeasyPrint (+ PyMuPDF).
# Обычная матрица Tests не ставит WeasyPrint: ему нужны системные библиотеки
# pango, которые тянут за собой apt-установку на каждой версии Python.
# Здесь один job с Python 3.12 — этого достаточно, чтобы поймать регрессии
# реального рендера (PDF/PNG/DOCX/EPUB/PPTX).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  e2e-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WeasyPrint system dependencies
        # WeasyPrint (pangocffi) требует pango/cairo/gdk-pixbuf и шрифты.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info \
            libjpeg-dev libopenjp2-7-dev \
            fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint PyMuPDF pypdf Pillow
          pip install markdown pymdown-extensions jinja2 markupsafe pygments
          pip install python-docx htmldocx ebooklib python-pptx

      - name: Verify WeasyPrint engine
        run: python -m weasyprint --version

      - name: Run end-to-end export test
        env:
          # REQUIRE_E2E=1 — отсутствие движка считается ошибкой, а не пропуском.
          REQUIRE_E2E: '1'
        run: python tests/test_e2e_export.py
