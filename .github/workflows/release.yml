name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Тесты: релиз не публикуется, если тесты красные ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pymdown-extensions jinja2 markupsafe pygments pypdf
          pip install PyQt6 python-docx htmldocx ebooklib python-pptx Pillow || true

      - name: Run tests
        run: python tests/run_all.py

  # ── Сборка Windows-артефактов ──
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (PyInstaller)
        # PDF-движок (weasyprint.exe) в репозитории отсутствует, поэтому собираем
        # без него: PDF/PNG/JPG-экспорт в собранном .exe будет недоступен.
        # Для полноценной сборки положи weasyprint.exe в weasyprint-windows/dist/
        # и убери флаг --skip-pdf-engine.
        run: python build.py --skip-pdf-engine

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownToPDF-windows
          path: |
            dist/MarkdownToPDF.exe
            dist/MarkdownToPDF_Setup.exe
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MarkdownToPDF.exe
            dist/MarkdownToPDF_Setup.exe
          draft: false
          generate_release_notes: true
          body: |
            **Note:** Сборка выполнена через `--skip-pdf-engine` —
            PDF/PNG/JPG-экспорт в этом `.exe` недоступен без портативного `weasyprint.exe`.
            См. раздел «PDF Engine» в README.
