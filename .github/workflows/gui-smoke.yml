name: GUI Smoke

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GUI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6
          # Зависимости реального экспорта (HTML/DOCX) для smoke-проверки
          pip install markdown pymdown-extensions jinja2 markupsafe pygments python-docx htmldocx

      - name: Install offscreen system libraries
        # Qt требует набор системных библиотек даже в offscreen-режиме.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libfontconfig1 libfreetype6

      - name: Run GUI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_gui.py
