name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install markdown pymdown-extensions jinja2 markupsafe pygments pypdf

    - name: Install renderer & GUI dependencies (best effort)
      # PyQt6 нужен, чтобы GUI-модули импортировались по-настоящему (не через стаб).
      # Остальное — чтобы тесты рендереров проверяли реальный путь, а не ImportError.
      run: |
        pip install PyQt6 python-docx htmldocx ebooklib python-pptx Pillow || true

    - name: Run tests
      run: python tests/run_all.py
