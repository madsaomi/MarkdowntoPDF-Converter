name: Coverage

# Контроль покрытия кода. Порог не даёт регрессиям пройти незамеченными.
#
# Измерение идёт через pytest (в одном процессе), потому что канонический
# `tests/run_all.py` запускает каждый тест-файл отдельным подпроцессом, и
# coverage не собирает данные подпроцессов без дополнительной настройки.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage pytest-timeout
          pip install markdown pymdown-extensions jinja2 markupsafe pygments pypdf
          pip install PyQt6 python-docx htmldocx ebooklib python-pptx Pillow || true

      - name: Install offscreen system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libfontconfig1 libfreetype6

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m coverage run --source=src --omit="src/__version__.py" \
            -m pytest tests/ -q --timeout=300
          python -m coverage report --show-missing

      - name: Check coverage threshold
        # Порог = измеренный уровень минус запас на различия окружений.
        run: python -m coverage report --fail-under=60
